<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="elodea-stem" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#15803d"/>
          <stop offset="100%" stop-color="#4ade80"/>
