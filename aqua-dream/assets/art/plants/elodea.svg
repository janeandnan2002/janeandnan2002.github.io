      </defs>
      <!-- 3 Waving Stems with Dense Ruffled Whorls -->
      <!-- Stem 1 (Center) -->
      <path d="M100 230 C80 180 120 130 95 70 C85 45 95 20 100 15" stroke="url(#elodea-stem)" stroke-width="4.5" fill="none"/>
      <!-- Stem 2 (Left) -->
      <path d="M85 235 C55 190 70 140 55 90 C45 65 55 35 60 25" stroke="url(#elodea-stem)" stroke-width="4" fill="none"/>
      <!-- Stem 3 (Right) -->
      <path d="M115 235 C135 190 120 140 140 85 C150 60 145 35 140 25" stroke="url(#elodea-stem)" stroke-width="4" fill="none"/>
      
      <!-- Leaf whorls repeated along stems -->
      <g fill="#22c55e" stroke="#14532d" stroke-width="0.8">
        <!-- Center stem leaves -->
        <ellipse cx="88" cy="175" rx="14" ry="4" transform="rotate(-20 88 175)"/>
        <ellipse cx="108" cy="170" rx="14" ry="4" transform="rotate(25 108 170)"/>
        <ellipse cx="98" cy="150" rx="15" ry="4" transform="rotate(-15 98 150)"/>
        <ellipse cx="118" cy="145" rx="15" ry="4" transform="rotate(30 118 145)"/>
