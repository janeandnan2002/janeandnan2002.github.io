        <!-- Right stem leaves -->
        <ellipse cx="118" cy="180" rx="13" ry="4" transform="rotate(-20 118 180)"/>
        <ellipse cx="138" cy="175" rx="13" ry="4" transform="rotate(30 138 175)"/>
        <ellipse cx="120" cy="135" rx="13" ry="3.5" transform="rotate(-15 120 135)"/>
