        <ellipse cx="92" cy="85" rx="13" ry="3.5" transform="rotate(-25 92 85)"/>
        <ellipse cx="112" cy="80" rx="13" ry="3.5" transform="rotate(25 112 80)"/>
        <ellipse cx="88" cy="55" rx="12" ry="3" transform="rotate(-15 88 55)"/>
        <ellipse cx="106" cy="50" rx="12" ry="3" transform="rotate(20 106 50)"/>
        
        <!-- Left stem leaves -->
        <ellipse cx="62" cy="180" rx="13" ry="4" transform="rotate(-30 62 180)"/>
        <ellipse cx="80" cy="170" rx="13" ry="4" transform="rotate(20 80 170)"/>
        <ellipse cx="55" cy="135" rx="13" ry="3.5" transform="rotate(-25 55 135)"/>
        <ellipse cx="74" cy="130" rx="13" ry="3.5" transform="rotate(25 74 130)"/>
        <ellipse cx="48" cy="90" rx="12" ry="3.5" transform="rotate(-35 48 90)"/>
