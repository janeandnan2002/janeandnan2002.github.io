<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="carpet-stone" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#78716c"/>
          <stop offset="100%" stop-color="#292524"/>
        </radialGradient>
        <radialGradient id="pearl-bead" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#bef264"/>
          <stop offset="70%" stop-color="#4ade80"/>
          <stop offset="100%" stop-color="#15803d"/>
        </radialGradient>
      </defs>
      <!-- River Pebbles Base -->
      <ellipse cx="100" cy="180" rx="85" ry="35" fill="url(#carpet-stone)"/>
      <ellipse cx="60" cy="195" rx="45" ry="22" fill="#44403c"/>
      <ellipse cx="140" cy="195" rx="45" ry="22" fill="#44403c"/>
      <!-- Dense Bright Green Pearl Cluster (Tiny Round Leaves Carpet) -->
      <g fill="url(#pearl-bead)" stroke="#166534" stroke-width="0.8">
        <circle cx="100" cy="160" r="14"/><circle cx="85" cy="155" r="13"/><circle cx="115" cy="155" r="13"/>
        <circle cx="70" cy="165" r="12"/><circle cx="130" cy="165" r="12"/><circle cx="55" cy="175" r="11"/>
        <circle cx="145" cy="175" r="11"/><circle cx="40" cy="185" r="10"/><circle cx="160" cy="185" r="10"/>
        <circle cx="90" cy="142" r="12"/><circle cx="110" cy="142" r="12"/><circle cx="100" cy="132" r="11"/>
        <circle cx="75" cy="148" r="11"/><circle cx="125" cy="148" r="11"/>
        <!-- Overflowing pearl sprouts -->
        <circle cx="30" cy="195" r="8"/><circle cx="170" cy="195" r="8"/><circle cx="50" cy="205" r="8"/>
        <circle cx="150" cy="205" r="8"/><circle cx="80" cy="210" r="9"/><circle cx="120" cy="210" r="9"/>
        <circle cx="100" cy="212" r="9"/>
      </g>
      <!-- Tiny Oxygen Bubbles from photosynthesis -->
      <circle cx="100" cy="115" r="3.5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
      <circle cx="80" cy="130" r="2.5" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
      <circle cx="125" cy="125" r="3" fill="#e0f2fe" stroke="#38bdf8" stroke-width="0.8" opacity="0.9"/>
    </svg>